<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in · our games</title>
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --surface-2: #f2f2f7; --text: #1d1d1f; --text-2: #6e6e73; --accent: #0071e3; --tg: #2aabee;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .card { width: min(400px, calc(100% - 24px)); background: var(--surface); border-radius: 26px; padding: 30px 22px 22px; text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06); }
  .games { display: flex; justify-content: center; gap: 10px; font-size: 34px; margin-bottom: 14px; }
  .games span { width: 58px; height: 58px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  p { margin: 8px 0 0; color: var(--text-2); font-size: 15px; line-height: 1.4; }
  button { font: inherit; border: 0; cursor: pointer; }
  .tg { margin-top: 20px; width: 100%; height: 54px; border-radius: 14px; background: var(--tg); color: #fff; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .16s; }
  .tg:active { transform: scale(.97); }
  .tg svg { width: 22px; height: 22px; }
  .back { margin-top: 10px; background: none; color: var(--accent); font-size: 15px; height: 40px; }
  .wait { margin-top: 18px; font-size: 14px; color: var(--text-2); display: none; }
  .wait.on { display: block; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!--
  Общий вход для наших игр (Страны мира, Дебюты, Судоку-батл).
  Игра присылает сюда: ?mode=check|login&return=<адрес игры>&lang=en|ru|sr (без lang — английский)
  check — тихая проверка: если здесь уже вошли, сразу возвращаем сессию, иначе #sso=none.
  login — показываем вход через Telegram (тот же бот и сессии, что у «Стран мира»), потом возвращаем.
  Сессия уходит только на адреса из списка ALLOWED, в хеше ссылки (#sso=…), чтобы не попадать в логи серверов.
-->
<div class="card" id="card" hidden>
  <div class="games"><span>🌍</span><span>♟️</span><span>🧩</span></div>
  <h1 id="h"></h1>
  <p id="sub"></p>
  <button class="tg" id="tg"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.2 1.4 11.7c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg><span id="tgl"></span></button>
  <div class="wait" id="wait"><span class="spin"></span><span id="waitl"></span></div>
  <button class="back" id="back"></button>
</div>
<script>
(() => {
  const ALLOWED = [
    /^https:\/\/sudoku-duel-rosy\.vercel\.app$/,
    /^https:\/\/chess-openings-lemon\.vercel\.app$/,
    /^https:\/\/our-ritual\.vercel\.app$/,
    /^https:\/\/countries-game-khaki\.vercel\.app$/,
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/,
  ];
  const KEY = "countries-game-session-v1";
  const q = new URLSearchParams(location.search);
  const mode = q.get("mode") === "login" ? "login" : "check";
  const ql = q.get("lang");
  const lang = ql === "sr" || ql === "rs" ? "sr" : ql === "ru" ? "ru" : "en";
  document.documentElement.lang = lang === "sr" ? "sr-Latn" : lang;
  const L = {
    en: { h: "One sign-in for all games", sub: "Countries of the World, Openings and Sudoku Duel. Sign in once with Telegram and you're signed in everywhere.", tg: "Sign in with Telegram", wait: "Confirm the sign-in in Telegram and come back here", back: "Back without signing in", badReturn: "Unknown return address", noTg: "Telegram is unavailable" },
    ru: { h: "Один вход для всех игр", sub: "Страны мира, Дебюты и Судоку-батл. Войди один раз через Telegram — и ты вошёл везде.", tg: "Войти через Telegram", wait: "Подтверди вход в Telegram и вернись сюда", back: "Назад без входа", badReturn: "Неизвестный адрес возврата", noTg: "Telegram недоступен" },
    sr: { h: "Jedna prijava za sve igre", sub: "Zemlje sveta, Otvaranja i Sudoku duel. Prijavi se jednom preko Telegrama — i prijavljen si svuda.", tg: "Prijavi se preko Telegrama", wait: "Potvrdi prijavu u Telegramu i vrati se ovde", back: "Nazad bez prijave", badReturn: "Nepoznata adresa za povratak", noTg: "Telegram nije dostupan" },
  }[lang];

  let ret;
  try {
    ret = new URL(q.get("return") || "");
    if (!ALLOWED.some((r) => r.test(ret.origin))) ret = null;
  } catch { ret = null; }
  if (!ret) { document.body.textContent = L.badReturn; return; }
  // Ritual (привычки на двоих) не показывается среди игр — для него свой заголовок карточки.
  const RITUAL = {
    en: { h: "Sign in to Ritual", sub: "The same Telegram sign-in as in our games." },
    ru: { h: "Вход в Ritual", sub: "Тот же вход через Telegram, что и в наших играх." },
    sr: { h: "Prijava u Ritual", sub: "Ista prijava preko Telegrama kao u našim igrama." },
  }[lang];
  const forRitual = ret.origin === "https://our-ritual.vercel.app";

  const back = (val) => {
    ret.hash = `sso=${encodeURIComponent(val)}`;
    location.replace(ret.toString());
  };
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } })();

  async function valid(session) {
    try {
      const r = await fetch(`/api/me?session=${encodeURIComponent(session)}`);
      return r.ok;
    } catch { return true; } // сеть моргнула — пусть игра сама перепроверит
  }

  async function run() {
    if (saved?.session && (await valid(saved.session))) return back(saved.session);
    if (saved?.session) localStorage.removeItem(KEY);
    if (mode === "check") return back("none");
    showLogin();
  }

  function showLogin() {
    const $ = (id) => document.getElementById(id);
    $("h").textContent = forRitual ? RITUAL.h : L.h; $("sub").textContent = forRitual ? RITUAL.sub : L.sub; $("tgl").textContent = L.tg;
    if (forRitual) document.querySelector(".games").innerHTML = "<span>🪥</span>";
    $("waitl").textContent = L.wait; $("back").textContent = L.back;
    $("card").hidden = false;
    $("back").onclick = () => back("none");
    $("tg").onclick = async () => {
      $("tg").disabled = true;
      let start;
      try {
        const r = await fetch("/api/auth/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lang }) });
        start = await r.json();
        if (!r.ok) throw new Error(start.error);
      } catch (e) {
        $("tg").disabled = false;
        alert(e.message || L.noTg);
        return;
      }
      // Открываем бота: на телефоне уходит в приложение Telegram, эта вкладка ждёт подтверждения.
      const w = window.open(start.url, "_blank");
      if (!w) location.href = start.url;
      $("wait").classList.add("on");
      const until = Date.now() + 10 * 60 * 1000;
      const poll = async () => {
        if (Date.now() > until) { $("wait").classList.remove("on"); $("tg").disabled = false; return; }
        try {
          const r = await fetch(`/api/auth/status?token=${encodeURIComponent(start.token)}`);
          const j = await r.json();
          if (j.done) {
            localStorage.setItem(KEY, JSON.stringify({ session: j.session, user: j.user }));
            return back(j.session);
          }
          if (j.expired) { $("wait").classList.remove("on"); $("tg").disabled = false; return; }
        } catch {}
        setTimeout(poll, 2000);
      };
      poll();
    };
  }
  run();
})();
</script>
</body>
</html>
